id: ttrpg-wiki
name: TTRPG Wiki
version: 1.0.1
kind: scraper
target: game-system
homepage: https://ttrpgwiki.com
description: System metadata (publisher, year, family, dice, licence, genre) for 236 tabletop RPGs.
attribution: Data from TTRPG Wiki (ttrpgwiki.com)
grimoire_min_version: 1.5.5

source:
  # The site publishes its whole catalogue as one static JSON document, so a
  # single daily fetch serves every lookup and no page scraping is needed.
  url: https://ttrpgwiki.com/data/systems.json
  format: json
  cache_ttl: 86400
  user_agent: "Grimoire/{version} (+https://github.com/hunter-read/grimoire)"

records:
  # The document is a bare top-level array.
  root: "$"
  # NOTE: deliberately no skip_when on `hidden`. Upstream sets that flag on
  # superseded editions as well as on staged records — the only two records
  # carrying it are D&D 4th Edition and Cairn 1st Edition, both real published
  # systems a user may own books for. Skipping them made those editions
  # impossible to select. Nothing else in the feed marks a record as staged, so
  # we surface everything and accept the occasional preview entry.

search:
  fields:
    - { field: name, weight: 1.0, strategy: fuzzy }
    # Edition is a weak signal: it disambiguates "Pathfinder 2nd Edition" from
    # "Pathfinder", but must not outweigh the name itself.
    - { field: edition, weight: 0.3, strategy: fuzzy }
    # The short marketing label ("5.5e", "4e", "1e"), present only on the four
    # records belonging to a split edition line. Helps break ties between two
    # editions of one system. NOTE: a bare "4e" query still will not match on
    # its own — score_record averages across all fields, so a 2-char query is
    # swamped by the fuzzy ratio against the much longer name. Fixing that
    # properly needs a short-query rule in the scorer, not a bigger weight
    # here; weighting this above `name` would skew the other 232 records.
    - { field: editionLabel, weight: 0.3, strategy: fuzzy }
  min_score: 0.55
  limit: 10
  # Stays on {edition} rather than {editionLabel}: the label field is populated
  # on 4 of 236 records, and a missing placeholder collapses to "Pathfinder ()"
  # rather than dropping the parens.
  #
  # TODO: superseded editions render an awkward label. Where a system's editions
  # are split across records, upstream bakes the edition into `name` and puts
  # something unrelated in `edition`:
  #
  #     name "Dungeons & Dragons 4th Edition" + edition "Core Rulebooks"
  #       -> "Dungeons & Dragons 4th Edition (Core Rulebooks)"
  #     name "Cairn 1st Edition"              + edition "1st Edition"
  #       -> "Cairn 1st Edition (1st Edition)"
  #
  # Both should read "<system> (<edition>)" — e.g. "Dungeons & Dragons
  # (4th Edition)". This is cosmetic only: the records resolve, map, and link
  # correctly, and their `editionLabel` ("4e", "1e") is already searchable.
  #
  # Not fixable from this file. `_render` substitutes whole field values, so
  # there is no way to express "name minus its trailing edition phrase", and the
  # transform allowlist is a closed set of argument-free string functions (no
  # regex or expressions, deliberately, since these definitions are untrusted).
  # Upstream has no base-name field to build from either — `baseName`/`system`/
  # `line` are all absent. Fixing it needs either a new `strip_edition`
  # transform in backend/addons/transforms.py, or upstream splitting the edition
  # out of `name`. The latter is the real defect and worth reporting.
  label: { template: "{name} ({edition})" }
  # Records carry no slug. The site derives one from the name, and a plain
  # slugify reproduces it for all but a few duplicated-edition titles. It is
  # only used to build the human-facing source link.
  identity: { template: "{name}", transform: slugify }
  url: { template: "https://ttrpgwiki.com/systems/{identity}" }
  # Lets a user paste a system URL (or the bare slug) instead of searching.
  identity_pattern: "/systems/([a-z0-9-]+)"

map:
  # `tagline` is a one-line summary — the closest thing to a description the
  # source has. `coreMechanic`/`bestFor` are longer but read as review copy
  # rather than a neutral description, so they are deliberately not mapped.
  description: { from: tagline }
  publishers: { from: publisher, as: link_list }
  year: { from: year }
  license: { from: license }
  system_family: { from: family }
  edition: { from: edition }
  # Source genres are lowercase tokens ("fantasy", "post-apocalyptic").
  genres: { from: genre, transform: titlecase }
  # `dice` is free-form prose ("d6 dice pool", "d4–d12", "Diceless"), not a
  # delimited list — kept whole rather than split into meaningless fragments.
  dice_materials: { from: dice }
  tags: { from: tags }
  urls:
    # A link back to the page this metadata came from, so the user can revisit
    # the source later. {identity} is the resolved slug.
    - { label: "TTRPG Wiki", template: "https://ttrpgwiki.com/systems/{identity}" }
    - { label: "Official site", from: officialUrl, when_present: true }
    # The source's store links carry its affiliate_id; strip_query drops it so
    # a user's own library doesn't end up full of someone else's referral tags.
    - { label: "DriveThruRPG", from: dtrpgUrl, when_present: true, transform: strip_query }
