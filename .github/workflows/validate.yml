name: Validate add-ons and templates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      # On a PR the committed indexes must already match the add-ons and note
      # templates, so a contributor sees exactly what their change produces.
      - name: Validate add-ons and templates, and check indexes are current
        run: python3 scripts/build_index.py --check
