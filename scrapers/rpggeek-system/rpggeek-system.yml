id: rpggeek-system
name: RPGGeek (System)
version: 1.0.0
kind: scraper
target: game-system
homepage: https://rpggeek.com
description: Game-system metadata (publishers, year, genres, dice, system family) from RPGGeek.
attribution: Data from RPGGeek (rpggeek.com)
grimoire_min_version: 1.5.5

search:
  identity_pattern: 'rpggeek\.com/rpg/(\d+)'
  fields:
    - field: name

script:
  entry: rpggeek_system.py
  # Two requests per lookup (search + detail), both against rpggeek.com. 60s is
  # generous; in practice it completes in well under 5s on a healthy connection.
  timeout: 60
